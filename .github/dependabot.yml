# Dependabot configuration.
#
# Sibling configs (keep in sync when changing policy):
#   BrainCOGS/U19-pipeline-python
#
# Every ecosystem has a 7-day cooldown so brand-new releases are not proposed
# right away. Version and security updates are grouped independently.
#
# npm: the repo uses pnpm 10 (pnpm-lock.yaml). Dependabot handles it under
# the `npm` ecosystem. Stay on pnpm 10 until Dependabot supports pnpm 11
# (dependabot/dependabot-core#14794). pnpm's own `minimumReleaseAge` in
# pnpm-workspace.yaml enforces the same 7-day quarantine locally and in CI.

version: 2

updates:
  #
  # GitHub Actions
  #
  - package-ecosystem: "github-actions"
    directory: "/"
    cooldown:
      default-days: 7

    schedule:
      interval: "monthly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"

    open-pull-requests-limit: 5

    labels:
      - "dependencies"
      - "github-actions"

    commit-message:
      prefix: "ci"

    rebase-strategy: "auto"

    # A group without `applies-to` only batches scheduled version updates.
    # Security updates are grouped separately, so declare both or the
    # security fixes keep arriving as one PR per package.
    groups:
      actions:
        applies-to: "version-updates"
        patterns:
          - "*"
      actions-security:
        applies-to: "security-updates"
        patterns:
          - "*"

  #
  # Docker (root Dockerfile)
  #
  - package-ecosystem: "docker"
    directory: "/"
    cooldown:
      default-days: 7

    schedule:
      interval: "monthly"
      day: "tuesday"
      time: "06:00"
      timezone: "UTC"

    open-pull-requests-limit: 5

    labels:
      - "dependencies"
      - "docker"

    commit-message:
      prefix: "docker"

    # The Dockerfile uses the floating `node:lts` tag (same line as the
    # workflows' `lts/*`), so there is no node version here to bump.

    rebase-strategy: "auto"

    # A group without `applies-to` only batches scheduled version updates.
    # Security updates are grouped separately, so declare both or the
    # security fixes keep arriving as one PR per package.
    groups:
      docker:
        applies-to: "version-updates"
        patterns:
          - "*"
      docker-security:
        applies-to: "security-updates"
        patterns:
          - "*"

  #
  # npm (pnpm lockfile)
  #
  - package-ecosystem: "npm"
    directory: "/"
    cooldown:
      default-days: 7

    schedule:
      interval: "monthly"
      day: "thursday"
      time: "06:00"
      timezone: "UTC"

    open-pull-requests-limit: 5

    labels:
      - "dependencies"

    commit-message:
      prefix: "deps"

    rebase-strategy: "auto"

    # A group without `applies-to` only batches scheduled version updates.
    # Security updates are grouped separately, so declare both or the
    # security fixes keep arriving as one PR per package.
    groups:
      npm:
        applies-to: "version-updates"
        patterns:
          - "*"
      npm-security:
        applies-to: "security-updates"
        patterns:
          - "*"

name: Test

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # pnpm version comes from `packageManager` in package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # Always the current Node LTS, the same line as `node:lts` in the
      # Dockerfile (package.json `engines.node` is only the floor).
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          check-latest: true
          package-manager-cache: false

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # Every package except vue is a devDependency (it is a static site, so
      # the build toolchain *is* the supply chain), so audit the whole tree
      # rather than `--prod`. Fails on high or critical advisories.
      - name: Audit dependencies
        run: pnpm run audit

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build site
        run: pnpm run build

      - name: Run regression tests
        run: pnpm run test:dist

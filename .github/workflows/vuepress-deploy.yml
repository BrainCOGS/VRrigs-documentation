name: Build and Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The deploy step pushes to BRAINCOGS/braincogs.github.io with the
    # ACCESS_TOKEN secret. This job only needs to read this repository.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install Dependencies
        run: yarn

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build VuePress
        run: yarn build

      - name: Run regression tests
        run: yarn test

      - name: Deploy to GitHub Pages
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5.0.0
        with:
          target_branch: gh-pages
          build_dir: .vuepress/dist
          repo: BRAINCOGS/braincogs.github.io
        env:
          GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN }}

# Run with prek (`uvx prek run --all-files`) or pre-commit.
# Binary assets, the lockfile and generated files are excluded from the
# whitespace/EOF fixers so they are never rewritten.
exclude: |
  (?x)^(
    \.vitepress/(dist|cache)/.*|
    public/.*|
    pnpm-lock\.yaml|
    .*\.(png|jpe?g|gif|pdf|zip|step|ipt|iam|idw|dwg|stl|stp|stl)
  )$

# `prek install` also installs the commit-msg hook (default_install_hook_types).
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit, pre-merge-commit, manual]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-yaml
      - id: check-json
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace
        # Two trailing spaces are a Markdown hard line break; keep them.
        args: [--markdown-linebreak-ext=md]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.1
    hooks:
      - id: zizmor

  - repo: local
    hooks:
      # One spelling for AI attribution, so `git log --grep='^Assisted-by: '`
      # finds every AI-assisted commit: `Assisted-by: ClaudeCode:<model id>`,
      # with the exact model id (claude-opus-5-5, not claude-opus-5.5 or
      # "Claude Code:Opus 5"). Claude is never listed as a co-author.
      - id: ai-trailer
        name: 'AI trailer is "Assisted-by: ClaudeCode:<model id>"'
        language: pygrep
        entry: '^(?:(?!Assisted-by: ClaudeCode:claude-[a-z]+(?:-[0-9]+)+$)(?i:assisted[-_ ]?by)\s*:|(?i:co-authored[-_ ]?by)\s*:.*(?i:claude|anthropic))'
        stages: [commit-msg]

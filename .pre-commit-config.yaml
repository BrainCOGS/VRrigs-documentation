# Run with prek (`uvx prek run --all-files`) or pre-commit.
# Binary assets, the lockfile and generated files are excluded from the
# whitespace/EOF fixers so they are never rewritten.
exclude: |
  (?x)^(
    \.vitepress/(dist|cache)/.*|
    public/.*|
    pnpm-lock\.yaml|
    .*\.(png|jpe?g|gif|pdf|zip|step|ipt|iam|idw|dwg|stl|stp|stl)
  )$

# `prek install` also installs the commit-msg hook (default_install_hook_types).
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit, pre-merge-commit, manual]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-yaml
      - id: check-json
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace
        # Two trailing spaces are a Markdown hard line break; keep them.
        args: [--markdown-linebreak-ext=md]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      # Scans only the changes being introduced: the staged changes (or a
      # merge's own changes) on commit, the commits of the PR in CI (lint workflow).
      - id: gitleaks
        entry: .github/scripts/gitleaks-changes.sh

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.1
    hooks:
      - id: zizmor

  - repo: local
    hooks:
      # Humans author commits; AI help is disclosed with one
      # `Assisted-by: <Harness>:<model>` trailer per agent, and no AI agent is the
      # author, committer or a Co-authored-by. Vendored from agent-tooling
      # (hooks/check_ai_attribution.py, with its tests); CI runs it on every
      # commit of a PR or push (lint.yml).
      - id: ai-attribution
        name: AI attribution (Assisted-by trailer, no AI authors)
        language: python
        entry: python .github/scripts/check_ai_attribution.py
        stages: [commit-msg]
